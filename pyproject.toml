[project]
name = "stt-tts-tti-itt-models-experiments"
version = "0.1.0"
description = "STT and TTS API with multiple provider support"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.18",
    "pipecat-ai[webrtc,daily,silero,deepgram,openai,cartesia,local-smart-turn-v3,runner]>=0.0.106",
    "pipecat-ai-cli",
    "torch",
    "certifi>=2025.11.12",
    "deepeval",
    # LlamaIndex for vector storage and indexing
    "llama-index-core>=0.14.7",
    "llama-index-llms-openai>=0.6.8",
    "llama-index-embeddings-openai>=0.5.1",
    "llama-index-embeddings-google-genai>=0.3.1",
    "llama-index-embeddings-ollama>=0.8.4",
    "llama-index-vector-stores-qdrant>=0.9.0",
    "llama-index-embeddings-huggingface>=0.7.0",
    # Vector search engine
    "qdrant-client>=1.16.2",
    # Embedding
    "sentence-transformers>=5.0.0",
    # LLM providers
    "openai>=1.108.1,<3",
    "anthropic>=1.2.0",
    # Voice agent SDK
    "supafone-labs>=0.5.3",
    # Payments
    "stripe>=15.6.0",
    # HTTP / web stack
    "starlette>=1.6.0",
    "httpcore>=1.0.9",
    "httpx2>=2.12.0",
    "httpcore2>=2.12.0",
    "requests>=2.34.2",
    "urllib3>=2.7.0",
    "websockets>=13.0,<17.0",
    "anyio>=4.14.2",
    "sniffio>=1.3.1",
    "h11>=0.16.0",
    "email-validator>=2.3.0",
    "dnspython>=2.8.0",
    "idna>=3.19",
    "charset-normalizer>=3.5.1",
    "click>=8.5.0",
    "truststore>=0.10.4",
    "docstring-parser>=0.18.0",
    "annotated-doc>=0.0.5",
    "jiter>=0.16.0",
]

[tool.uv]
override-dependencies = [
    "onnxruntime==1.20.1",
]
